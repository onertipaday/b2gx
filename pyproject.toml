[project]
name = "b2gx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sonegop", email = "paolo.sonego@fmach.it" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "networkx>=3.6.1",
    "obonet>=1.3.0",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
]

[project.scripts]
b2gx = "b2gx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
